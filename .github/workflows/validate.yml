name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '31 5 * * 1'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        home-assistant: ['2026.11.0', '2026.11.3']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install "pytest-homeassistant==${{ matrix.home-assistant }}" ruff pip-audit
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: python -m pip check
      - run: python -m pip_audit --strict
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
