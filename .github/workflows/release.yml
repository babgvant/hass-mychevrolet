name: Prepare release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching manifest.json, e.g. 0.2.0'
        required: true
        type: string
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify and package the integration
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/package_release.py "$RELEASE_VERSION"
      - name: Prepare draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "v$RELEASE_VERSION" dist/mychevrolet.zip --draft --target "$GITHUB_SHA" --generate-notes
